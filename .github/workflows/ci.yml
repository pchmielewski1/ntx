name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make ntx
      - name: Size gate (< 1 MiB)
        run: make size
      - name: Unit tests
        run: make test
      - name: CLI validation tests
        run: make test-cli
      - name: Loopback smoke test
        run: make test-net
      - name: JSON control API (NDJSON) e2e
        run: make test-ipc
      - name: TLS 1.3 interop (openssl s_server)
        run: make test-tls13

  riscv64:
    name: build + test (riscv64, cross + qemu-user)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the riscv64 cross toolchain and qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
      - name: Build
        run: make riscv
      - name: Size gate (< 1 MiB)
        run: make size-riscv
      - name: Unit tests under qemu-riscv64
        run: make test-riscv
      - name: CLI, loopback, JSON API and TLS 1.3 gates under qemu-riscv64
        run: make test-riscv-shell

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: >
          make test
          CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
          -fno-sanitize-recover=undefined -std=c11 -D_POSIX_C_SOURCE=200809L"
