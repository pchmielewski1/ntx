name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make ntx
      - name: Size gate (< 1 MiB)
        run: make size
      - name: Unit tests
        run: make test
      - name: CLI validation tests
        run: make test-cli
      - name: Loopback smoke test
        run: make test-net
      - name: JSON control API (NDJSON) e2e
        run: make test-ipc
      - name: TLS 1.3 interop (openssl s_server)
        run: make test-tls13

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: >
          make test
          CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
          -fno-sanitize-recover=undefined -std=c11 -D_POSIX_C_SOURCE=200809L"
