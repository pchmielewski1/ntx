name: release

# Every push to main publishes a new release with the patch number incremented (v0.1.0, v0.1.1, ...), unless
# the head commit message contains "[skip release]". Pushing a tag vX.Y.Z (or vX.Y.Z-rc1, published as a
# pre-release) publishes exactly that version instead. Each release has the binaries and .deb packages for
# x86-64 and arm64 and a SHA256SUMS file; nothing is published unless the tests pass on both architectures.
on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual run from the Actions tab: builds and tests everything and keeps the files as workflow artifacts,
  # but publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two quick pushes cannot pick the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          build=true
          publish=true
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::tag $GITHUB_REF_NAME is not of the form vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            # Next patch number after the highest stable tag (pre-release tags are ignored); 0.1.0 if there is none.
            last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -z "$last" ]; then
              version=0.1.0
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              version="$major.$minor.$((patch + 1))"
            fi
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              publish=false
            elif printf '%s' "$COMMIT_MESSAGE" | grep -qF '[skip release]'; then
              build=false
              publish=false
            fi
          fi
          echo "version=$version build=$build publish=$publish"
          {
            echo "version=$version"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) so the binaries also run on older distributions.
          - { runner: ubuntu-22.04,     arch: x86_64,  deb_arch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64, deb_arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make ntx NTX_VERSION="$VERSION"

      - name: Size gate (< 1 MiB)
        run: make size

      - name: Tests
        run: |
          ./ntx --version
          make test
          make test-cli
          make test-net
          make test-ipc
          make test-tls13

      - name: Package
        run: |
          mkdir dist
          cp ntx "dist/ntx-${VERSION}-linux-${{ matrix.arch }}"
          strip --strip-unneeded "dist/ntx-${VERSION}-linux-${{ matrix.arch }}"
          packaging/build-deb.sh "$VERSION" "${{ matrix.deb_arch }}" ./ntx dist
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          # The CHANGELOG.md section for this version, if there is one ("## <version> ..." up to the next "## ").
          awk -v v="${VERSION%%-*}" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) found = 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ## Install

          - **Debian / Ubuntu:** `sudo apt install ./ntx_@VERSION@_amd64.deb` (or `_arm64.deb`).
          - **Any Linux:** download the binary for your CPU (`x86_64` or `aarch64`), `chmod +x` it and run it.
          - Check the download against `SHA256SUMS`.
          EOF
          sed -i "s/@VERSION@/$VERSION/" notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          # --generate-notes appends the list of commits since the previous release to the notes above.
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "ntx $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            $flags
